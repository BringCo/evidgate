name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest moved to 26.04, where setup-python has no 3.9 build yet.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: unit tests
        run: python -m unittest discover -s tests -v

      - name: examples block as designed (exit 1 is the expected result)
        run: |
          set +e
          ./bin/evidgate run --dir examples/mixed > /tmp/mixed.txt 2>&1
          rc=$?
          cat /tmp/mixed.txt
          test "$rc" -eq 1
          grep -q "RELEASE BLOCKED" /tmp/mixed.txt

      - name: doctor is green on every example
        run: |
          for d in examples examples/mixed examples/artifact; do
            ./bin/evidgate doctor --dir "$d"
          done

      - name: builds, installs, and the installed entry point runs
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
          evidgate --version
