name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest moved to 26.04, where setup-python has no 3.9 build yet.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13", "3.14"]
    # 3.14 is exercised but not enforced yet: the runner image's 3.14 build can lag,
    # and the suite is already green on 3.14 locally.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: lint (ruff)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install ruff
          ruff check .

      - name: unit tests (coverage gate 70%)
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --include="evidgate/*" --fail-under=70

      - name: evidgate checks evidgate (dogfood, must be green)
        run: ./bin/evidgate run --dir .

      - name: every example blocks as designed (exit 1 is the expected result)
        run: |
          set +e
          for d in examples examples/mixed examples/artifact examples/figures; do
            out="/tmp/$(basename "$d").txt"
            ./bin/evidgate run --dir "$d" > "$out" 2>&1
            rc=$?
            echo "=== $d (rc=$rc) ==="
            cat "$out"
            test "$rc" -eq 1 || { echo "expected exit 1 from $d"; exit 1; }
            grep -q "RELEASE BLOCKED" "$out" || { echo "no RELEASE BLOCKED in $d"; exit 1; }
            grep -q "^PASS " "$out" || { echo "no summary line in $d"; exit 1; }
          done

      - name: doctor is green on every example
        run: |
          for d in examples examples/mixed examples/artifact examples/figures; do
            ./bin/evidgate doctor --dir "$d"
          done

      - name: builds, installs, and the installed entry point runs
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
          evidgate --version