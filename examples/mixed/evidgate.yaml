# evidgate, mixed domain: one ledger holding prose checks, artifact checks
# and code checks. The engine has no idea which is which -- that is the point.
project: mixed-delivery (fictional)
ledger: evidgate_ledger.md

checks:
  # --- prose (a drafted document) ---
  - cid: D1
    name: 草稿里的绝对化词带范围或检索日期
    method: ../../bin/evidgate prose scan --file draft.md --rule absolutes
    expect: exit:0
    counter: draft.md 里「首次实现」未给检索日期，本项必须变红
    severity: red

  - cid: D2
    name: 草稿里的统计数字带口径
    method: ../../bin/evidgate prose scan --file draft.md --rule numeral_scope
    expect: exit:0
    counter: draft.md 里「降低 18.4%」不写 n 与协议，应变成黄
    severity: yellow

  # --- artifact (a produced file) ---
  - cid: A1
    name: 产物存在且非空
    method: test -s build/out.txt && wc -c < build/out.txt
    expect: exit:0; regex:\d
    counter: 清空 build/out.txt，本项必须变红
    severity: red

  - cid: A2
    name: 正本与其派生副本逐字节一致
    method: cmp -s src/app.py src/app.py.bak
    expect: exit:0
    counter: 改 RATE 但忘了同步 .bak，本项必须变红（示例里就是这样）
    severity: red

  # --- code (the thing that produced the artifact) ---
  - cid: C1
    name: 代码单测全绿
    method: cd src && python3 -m unittest -q test_app
    expect: exit:0
    counter: 把 estimate 改成返回负数，本项必须变红
    severity: red

  - cid: C2
    name: 源码里没有明文密钥
    method: cat src/app.py
    expect: exit:0; not_contains:api_key; not_contains:secret_key
    counter: 在 app.py 里写一行 api_key = "xxx"，本项必须变红
    severity: red

  - cid: C3
    name: 源码里没有残留 TODO
    method: grep -rn TODO src/
    expect: exit:1
    counter: 加一行 # TODO: 回头改，本项必须变黄（grep 命中即退出码 0）
    severity: yellow
