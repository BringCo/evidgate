# evidgate checks itself. Same engine, same ledger, no special case.
# This is what the CI's dogfood step runs.
#
# `packs:` is written on one line on purpose: the built-in parser covers this form,
# while a nested mapping would need PyYAML, which the project does not require.
project: evidgate
ledger: evidgate_ledger.md

packs: repo:test_cmd=python3 -m unittest discover -s tests,pattern=^\s*#.*(TODO|FIXME|breakpoint\(\))