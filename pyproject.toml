[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidgate"
version = "0.3.0"
description = "Evidence gates for deliverables: every claim gets a command, an exit code, and a ledger line."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "BringCo"}]
keywords = ["evidence", "gate", "audit", "ledger", "reproducibility", "documentation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Documentation",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BringCo/evidgate"

[project.scripts]
evidgate = "evidgate.cli:main"

[tool.setuptools.packages.find]
include = ["evidgate*"]
